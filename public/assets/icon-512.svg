    <rect x="-8" y="-75" width="16" height="175" rx="6"/>
    <rect x="-65" y="-45" width="130" height="14" rx="7"/>
    <path d="M-95,45 Q0,135 95,45 L80,32 Q0,105 -80,32 Z"/>
    <polygon points="-102,32 -70,35 -92,65"/>
